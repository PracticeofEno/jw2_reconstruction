; 기본값은 144 FPS이며, 이 항목이 없어도 게임은 144 FPS로 실행됩니다.
; 이 값은 화면 렌더링 속도만 제어합니다. 게임 시뮬레이션, RNG, 명령 처리,
; P2P 동기화는 원본의 결정론적 갱신 주기를 그대로 유지합니다.
; 허용 범위는 30~360입니다. 0으로 설정하면 고주사율 렌더링을 끄고
; 원본 화면 표시 방식을 사용합니다. 60을 초과하면 유효한
; Jw2_09_144hz.rfa를 사용해 위치와 스프라이트 동작을 렌더링 전용으로 보간합니다.
; 게임 중 F11을 누르면 현재 설정과 관계없이 60 FPS와 144 FPS를 전환합니다.
; F11 전환은 현재 실행에만 적용되며 이 설정값을 변경하지 않습니다.
RenderFPS=144

